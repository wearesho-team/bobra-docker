name: Renovate

on:
  schedule:
    # Daily. CI tooling updates only go out on Monday's run (see renovate.json).
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency: renovate

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-24.04
    steps:
      # A GitHub App token rather than GITHUB_TOKEN: branches pushed with
      # GITHUB_TOKEN do not trigger workflows, so Renovate's PRs would never get
      # the build check.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ steps.token.outputs.token }}
          renovate-image: ghcr.io/renovatebot/renovate:44.166.0@sha256:510b885a90cd70437816c5c2da1d0c3beff513d3979497b2db1d37c84adfbc2b
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          # ./sync updates checksums and image tags on every update branch.
          RENOVATE_ALLOWED_COMMANDS: '["^\\./sync origin/[\\w./-]+$"]'
