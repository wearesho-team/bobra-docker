root /static;
include  /etc/nginx/mime.types;

location / {
    try_files $uri $uri/ /index.html;
}

location = /sw.js {
    expires -1;
    etag on;

    gzip_static on;
    brotli_static on;
}

location = /service-worker.js {
    expires -1;
    etag on;

    gzip_static on;
    brotli_static on;
}

location ~* ^.+\.webmanifest$ {
    expires 1d;
    add_header Cache-Control "public, must-revalidate";
    add_header Vary "Accept-Encoding";
    etag on;

    gzip_static on;
    brotli_static on;
}

location ~* ^.+\.(jpg|jpeg|gif|png|webp|avif|ico)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* ^.+\.(mp4|m4v|webm|ogv|ogg|oga|mp3|wav|weba|aac|flac|vtt)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ~* ^.+\.svg$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";

    gzip_static on;
    brotli_static on;
}

location ~* ^.+\.(css|js|mjs|wasm|woff|woff2|ttf|otf|eot)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";
    
    gzip_static on;
    brotli_static on;
}

location ~* ^.+\.json$ {
    access_log off;
    add_header Cache-Control $json_cache_control;
    add_header Vary "Accept-Encoding";
    etag on;

    gzip_static on;
    brotli_static on;
}

location ~* ^.+\.(pdf|txt|xml)$ {
    access_log off;
    expires 30d;
    add_header Cache-Control "public";
    add_header Vary "Accept-Encoding";
    
    gzip_static on;
    brotli_static on;
}

# Always revalidated (cheap 304 via ETag): a stale index.html keeps running the
# previous bundle and requests hashed chunks that the new image no longer has.
location ~* ^(.+\.html|.*/)$ {
    add_header Cache-Control "no-cache";
    etag on;
    
    gzip_static on;
    brotli_static on;
}

location ~* \.(map|log)$ {
    deny all;
}

client_max_body_size 1m;
